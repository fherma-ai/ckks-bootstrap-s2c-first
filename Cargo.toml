[package]
name = "ckks-bootstrap-reference"
version = "0.0.0"
edition = "2021"

# The binary the runner starts: ./fherma-solution <point directory>
[[bin]]
name = "fherma-solution"
path = "src/main.rs"

# Reference implementation for the CKKS bootstrapping benchmark: Poulpy's
# S2C-first pipeline at preset n16_d35_k685_p19_s2c_ffr_ci, with the keys of
# power-of-two rotations — the configuration Poulpy's own bootstrapping
# benchmark names `n16_d35_k685_p19_s2c_ffr_ci+pow2`. It is the wrapper:
# keygen and the input ciphertext are derived from seeds and are not
# measured; only the bootstrap call is timed. See README.md.
#
# Targets Poulpy 0.10.0, which adds the GPU backends and retires the k720
# preset of 2.0.0: the specification is at 3.0.0, and the 0.9.0 rows keep
# their own version and their own digests.

[dependencies]
poulpy-ckks = { version = "=0.10.0", features = ["test-utils"] }
poulpy-core = "=0.10.0"
poulpy-hal = "=0.10.0"
poulpy-cpu-portable = { version = "=0.10.0", features = ["enable-ckks"] }
sha2 = "0.10"
libc = "0.2" # peak RSS via getrusage, for the report
anyhow = "1"

# The fast backends; one is chosen by a feature.
poulpy-cpu-arm = { version = "=0.10.0", features = ["enable-neon", "enable-ckks"], optional = true }
poulpy-cpu-avx = { version = "=0.10.0", features = ["enable-avx", "enable-ckks"], optional = true }
poulpy-cpu-avx512 = { version = "=0.10.0", features = ["enable-avx512f", "enable-ckks"], optional = true }
poulpy-gpu-portable = { version = "=0.10.0", features = ["enable-ckks"], optional = true }
rayon = { version = "1", optional = true }

[features]
# Exactly one backend feature. The reference is `ifma-rayon` (AVX-512 IFMA on
# every core); `ref` is the portable baseline; `cuda` is an NVIDIA GPU, with
# the keys made on the host and prepared on the card. The `*-rayon` backends
# run the bootstrap on `threads` worker threads; the CPU ones without it are
# single-threaded. Build another backend with
#   cargo build --release --no-default-features --features <backend>
# and, for the SIMD ones, RUSTFLAGS="-C target-cpu=native".
default = ["cuda"]
ref = []
# Internal: pulled in by every `*-rayon` backend.
threaded = ["dep:rayon"]
neon = ["dep:poulpy-cpu-arm"]
neon-rayon = ["dep:poulpy-cpu-arm", "poulpy-cpu-arm/enable-rayon", "threaded"]
avx = ["dep:poulpy-cpu-avx"]
avx-rayon = ["dep:poulpy-cpu-avx", "poulpy-cpu-avx/enable-rayon", "threaded"]
avx512 = ["dep:poulpy-cpu-avx512"]
avx512-rayon = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-rayon", "threaded"]
ifma = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-ifma"]
ifma-rayon = ["dep:poulpy-cpu-avx512", "poulpy-cpu-avx512/enable-ifma", "poulpy-cpu-avx512/enable-rayon", "threaded"]
cuda = ["dep:poulpy-gpu-portable", "poulpy-gpu-portable/enable-cuda"]
wgpu = ["dep:poulpy-gpu-portable", "poulpy-gpu-portable/enable-metal"]

[profile.release]
opt-level = 3
